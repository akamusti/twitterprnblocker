name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Userscript syntax check
        run: node --check twitterprnblocker.user.js

      - name: Version consistency + privacy contract
        run: node scripts/check-consistency.mjs
